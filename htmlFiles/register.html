<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../cssFiles/login-style.css">
  <link rel="icon" href="../Photos/logo.png">
  <title>Register</title>
</head>
<body>

    <div>
      <button id="navButton1" class="navButton1" onclick="reg()">Register</button>
      <button id="navButton2" class="navButton2" onclick="log()">Login</button>
    </div>






  <div style="padding: 16px;">
        
  <form class="modal-content" method="post" id="reg" onsubmit="register()">

    <div style="padding: 16px;">

        <h1>Get Registered !</h1>
       <hr> <p>Please fill in this form to create an account.</p><hr>

        <label for="userid"><b>User ID</b></label>
        <input type="text" placeholder="Enter a User ID. (Do not enter you name)" name="userid" id="userid" autocomplete="off" required>

        <label for="email"><b>Email</b></label>
        <input type="email" placeholder="Enter your Email" name="email" id="email" autocomplete="off" required>

        <label for="password"><b>Password</b></label>
        <input type="password" placeholder="Enter Password" name="password" id="password" required>

        <label for="passwdRepeat"><b>Repeat Password</b></label>
        <input type="password" placeholder="Repeat Password" name="passwdRepeat" id="paswdRepeat" required>

        <input type="checkbox" checked="checked" name="remember"><label> Remember me</label>

        <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p>

        <div class="clearfix">
          <button type="submit" onclick="register()" class="signupbtn">Sign Up</button>
          <button type="button" onclick="window.location.href = 'index.html'" class="cancelbtn">Return</button>
        </div>
      </div>
    </form>
















    <form class="modal-content" onsubmit="login()" id="log" method="post">

      <div style="padding: 16px;">

        <h1>Login</h1>
         
        <label for="uname"><b>Username</b></label>
        <input type="text" placeholder="Enter Username" autocomplete="off" name="uname" id="login_userID" required>
  
        <label for="psw"><b>Password</b></label>
        <input type="password" placeholder="Enter Password" name="psw" id="login_paswd" required>
          
        <button type="submit" class="button">Login</button>
      </div>
  
      <div style="padding: 16px; background-color:#f1f1f1; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;">
        <button type="button" onclick="window.location.href = 'index.html'" class="cancelbtn">Return</button>
        <span class="psw"><a href="register.html">Forgot password?</a></span>
      </div>
    </form>

</div>






<script src="../javaScriptFiles/Login.js">document.getElementById("log").style.display = "none";</script>

</body>
</html>
